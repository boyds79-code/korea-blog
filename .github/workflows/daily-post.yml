name: Daily draft post

on:
  schedule:
    # 매일 00:00 UTC = 08:00 Asia/Manila. 시간을 바꾸려면 이 cron 값을 수정하세요.
    # (cron은 항상 UTC 기준입니다: https://crontab.guru)
    - cron: '0 0 * * *'
  workflow_dispatch: {} # 수동으로도 "Run workflow" 버튼으로 즉시 실행 가능

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate draft post
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: npm run generate

      - name: Open pull request for human review
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "New draft: ${{ env.POST_TITLE }}"
          branch: "draft/${{ env.POST_SLUG }}"
          delete-branch: true
          title: "📝 Draft: ${{ env.POST_TITLE }}"
          labels: draft-post
          body: |
            Auto-generated draft, ready for human review.

            - **Topic source:** `${{ env.TOPIC_SOURCE }}`
            - **File:** `src/content/blog/${{ env.POST_SLUG }}.md`

            **Before merging:**
            1. Read the full draft for factual accuracy — the model can be wrong about specifics.
            2. Make sure it adds real value beyond a generic summary (tighten anything generic/filler).
            3. Check the title/description read naturally and aren't keyword-stuffed.
            4. Merge this PR to publish (Vercel will auto-deploy on merge to `main`).

            If this post shouldn't be published, just close this PR without merging —
            nothing goes live until it's merged.
